[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bitgn-local-sdk"
version = "0.1.0"
description = "Locally generated Python SDK for the BitGN sample protocols"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "connectrpc==0.9.0",
    "protobuf>=6.33.0,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bitgn"]
